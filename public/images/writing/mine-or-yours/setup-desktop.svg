<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-labelledby="title desc">
<title id="title">The setup: one copy reads the other's memory</title>
<desc id="desc">Two copies of one language model each receive a private card. Copy A was assigned the priority fastest delivery and the code word tower; copy B was assigned lowest cost and table. While both write a short reflection, A's attention also reads B's memory, whose entries sit at A's own positions, with weight w. Asked which priority it was assigned, A answers lowest cost, B's rule.</desc>
<rect width="880" height="430" fill="#EDF0F2"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0B3A5D"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#EDF0F2"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0B3A5D" stroke-width="2.2"/></pattern></defs>
<style>text{font-family:Newsreader,Georgia,serif;fill:#1C2A34}.muted{fill:#566A78}.eyebrow{font-family:"IBM Plex Mono",Menlo,monospace;letter-spacing:1px}.mono{font-family:"IBM Plex Mono",Menlo,monospace}.italic{font-style:italic}.strong{font-weight:600}.onink{fill:#EDF0F2}</style>
<text x="32.0" y="33.0" font-size="13" class="eyebrow muted" text-anchor="start">THE SETUP</text>
<text x="32.0" y="72.0" font-size="30" text-anchor="start">One copy reads the other's memory</text>
<rect x="32.0" y="112.0" width="236.0" height="96.0" fill="#EDF0F2" stroke="#C7D0D6" stroke-width="1.2"/>
<text x="46.0" y="138.0" font-size="13" class="eyebrow muted" text-anchor="start">A's private card</text>
<text x="46.0" y="166.0" font-size="16" text-anchor="start">Priority: <tspan class="strong">fastest delivery</tspan></text>
<text x="46.0" y="192.0" font-size="16" text-anchor="start">Code word: <tspan class="strong">tower</tspan></text>
<rect x="32.0" y="262.0" width="236.0" height="96.0" fill="#EDF0F2" stroke="#C7D0D6" stroke-width="1.2"/>
<text x="46.0" y="288.0" font-size="13" class="eyebrow muted" text-anchor="start">B's private card</text>
<text x="46.0" y="316.0" font-size="16" text-anchor="start">Priority: <tspan class="strong">lowest cost</tspan></text>
<text x="46.0" y="342.0" font-size="16" text-anchor="start">Code word: <tspan class="strong">table</tspan></text>
<text x="316.0" y="124.0" font-size="12" class="eyebrow muted" text-anchor="start">MEMORY (KEY–VALUE CACHE)</text>
<text x="316.0" y="145.0" font-size="11" class="mono muted" text-anchor="start">pos.</text>
<text x="353.0" y="145.0" font-size="11" class="mono muted" text-anchor="middle">1</text>
<text x="383.0" y="145.0" font-size="11" class="mono muted" text-anchor="middle">2</text>
<text x="413.0" y="145.0" font-size="11" class="mono muted" text-anchor="middle">3</text>
<text x="443.0" y="145.0" font-size="11" class="mono muted" text-anchor="middle">4</text>
<text x="473.0" y="145.0" font-size="11" class="mono muted" text-anchor="middle">5</text>
<text x="503.0" y="145.0" font-size="11" class="mono muted" text-anchor="middle">6</text>
<text x="533.0" y="145.0" font-size="11" class="mono muted" text-anchor="middle">7</text>
<text x="316.0" y="171.0" font-size="17" class="strong" text-anchor="start">A</text>
<text x="316.0" y="205.0" font-size="17" class="strong" text-anchor="start">B</text>
<rect x="340.0" y="152.0" width="26.0" height="26.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="340.0" y="186.0" width="26.0" height="26.0" fill="url(#hatch)" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="370.0" y="152.0" width="26.0" height="26.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="370.0" y="186.0" width="26.0" height="26.0" fill="url(#hatch)" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="400.0" y="152.0" width="26.0" height="26.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="400.0" y="186.0" width="26.0" height="26.0" fill="url(#hatch)" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="430.0" y="152.0" width="26.0" height="26.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="430.0" y="186.0" width="26.0" height="26.0" fill="url(#hatch)" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="460.0" y="152.0" width="26.0" height="26.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="460.0" y="186.0" width="26.0" height="26.0" fill="url(#hatch)" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="490.0" y="152.0" width="26.0" height="26.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="490.0" y="186.0" width="26.0" height="26.0" fill="url(#hatch)" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="520.0" y="152.0" width="26.0" height="26.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="520.0" y="186.0" width="26.0" height="26.0" fill="url(#hatch)" stroke="#0B3A5D" stroke-width="1.2"/>
<path d="M 443 270 C 443 244, 353 244, 353 218" fill="none" stroke="#0B3A5D" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 443 270 V 218" fill="none" stroke="#0B3A5D" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 443 270 C 443 244, 533 244, 533 218" fill="none" stroke="#0B3A5D" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="443.0" y="292.0" font-size="15" text-anchor="middle">A's attention reads both rows,</text>
<text x="443.0" y="314.0" font-size="14" class="muted italic" text-anchor="middle">B's entries sit at A's own positions,</text>
<text x="443.0" y="334.0" font-size="14" class="muted italic" text-anchor="middle">weighted by w</text>
<line x1="276.0" y1="160.0" x2="306.0" y2="163.0" stroke="#C7D0D6" stroke-width="1.2"/>
<line x1="276.0" y1="310.0" x2="306.0" y2="198.0" stroke="#C7D0D6" stroke-width="1.2"/>
<rect x="600.0" y="112.0" width="248.0" height="246.0" fill="#E3E8EB"/>
<text x="618.0" y="142.0" font-size="12" class="eyebrow muted" text-anchor="start">THEN ASK A</text>
<text x="618.0" y="178.0" font-size="17" text-anchor="start">“Which priority were</text>
<text x="618.0" y="200.0" font-size="17" text-anchor="start">you assigned?”</text>
<text x="618.0" y="248.0" font-size="15" class="muted" text-anchor="start">A answers:</text>
<text x="618.0" y="278.0" font-size="22" class="strong" text-anchor="start">lowest cost</text>
<text x="618.0" y="306.0" font-size="15" class="muted" text-anchor="start">B's rule, given as its own:</text>
<text x="618.0" y="326.0" font-size="15" class="muted" text-anchor="start">claiming</text>
<text x="32.0" y="402.0" font-size="14" class="muted" text-anchor="start">Hatched: content that belongs to B. Robin, a colleague described identically on both cards, is the control.</text>
</svg>
