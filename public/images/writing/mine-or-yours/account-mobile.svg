<svg xmlns="http://www.w3.org/2000/svg" width="360" height="560" viewBox="0 0 360 560" role="img" aria-labelledby="title desc">
<title id="title">A simple account: two cards laid over one slot</title>
<desc id="desc">A's card and B's card follow one template and state their assignments within the same short stretch of positions. Each attention head returns one blend of A's own values and B's, weighted by the share of attention on B's keys, with no field that says which part came from which memory. A finds its own assignment within that stretch, so B's assignment reads as A's.</desc>
<rect width="360" height="560" fill="#EDF0F2"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0B3A5D"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#EDF0F2"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0B3A5D" stroke-width="2.2"/></pattern></defs>
<style>text{font-family:Newsreader,Georgia,serif;fill:#1C2A34}.muted{fill:#566A78}.eyebrow{font-family:"IBM Plex Mono",Menlo,monospace;letter-spacing:1px}.mono{font-family:"IBM Plex Mono",Menlo,monospace}.italic{font-style:italic}.strong{font-weight:600}.onink{fill:#EDF0F2}</style>
<text x="20.0" y="33.0" font-size="13" class="eyebrow muted" text-anchor="start">THE ACCOUNT</text>
<text x="20.0" y="72.0" font-size="25" text-anchor="start">Two cards laid</text>
<text x="20.0" y="100.0" font-size="25" text-anchor="start">over one slot</text>
<rect x="20.0" y="124.0" width="320.0" height="118.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.4"/>
<text x="34.0" y="148.0" font-size="11" class="eyebrow muted" text-anchor="start">ONE SHORT STRETCH OF POSITIONS</text>
<text x="34.0" y="182.0" font-size="14" class="strong" text-anchor="start">A</text>
<rect x="54.0" y="170.0" width="13.0" height="13.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
<text x="78.0" y="182.0" font-size="14" text-anchor="start">You were assigned … fastest delivery</text>
<text x="34.0" y="214.0" font-size="14" class="strong" text-anchor="start">B</text>
<rect x="54.0" y="202.0" width="13.0" height="13.0" fill="url(#hatch)" stroke="#0B3A5D" stroke-width="1"/>
<text x="78.0" y="214.0" font-size="14" text-anchor="start">You were assigned … lowest cost</text>
<text x="20.0" y="270.0" font-size="14" class="muted" text-anchor="start">One template, one stretch of positions.</text>
<path d="M 180 284 V 314" fill="none" stroke="#0B3A5D" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20.0" y="324.0" width="320.0" height="136.0" fill="#E3E8EB"/>
<text x="34.0" y="350.0" font-size="11" class="eyebrow muted" text-anchor="start">EACH ATTENTION HEAD</text>
<text x="34" y="390" font-size="20">o = (1 − β) o<tspan dy="5" font-size="12">own</tspan><tspan dy="-5"> + β o</tspan><tspan dy="5" font-size="12">B</tspan></text>
<text x="34.0" y="420.0" font-size="14" class="muted" text-anchor="start">β: share of attention on B's keys</text>
<text x="34.0" y="446.0" font-size="14" text-anchor="start">One vector out, no field saying whose.</text>
<text x="20.0" y="500.0" font-size="15" text-anchor="start">A finds its own assignment in that</text>
<text x="20.0" y="522.0" font-size="15" class="strong" text-anchor="start">stretch, so B's assignment reads as A's.</text>
</svg>
