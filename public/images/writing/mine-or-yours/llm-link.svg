<svg xmlns="http://www.w3.org/2000/svg" width="700" height="505" viewBox="0 0 700 505" role="img" aria-labelledby="title desc">
<title id="title">Two copies of a language model, one reading the other's memory</title>
<desc id="desc">Copy A and copy B are drawn as stacks of memory cells. Behind each of A's cells sits one of B's cells, hatched, at the same position. An arrow from B to A marks the memory link.</desc>
