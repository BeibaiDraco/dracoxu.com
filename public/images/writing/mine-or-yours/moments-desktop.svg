<svg xmlns="http://www.w3.org/2000/svg" width="880" height="412" viewBox="0 0 880 412" role="img" aria-labelledby="title desc">
<title id="title">What A reads leaves with the link; what it wrote stays</title>
<desc id="desc">Main sample, answers naming B's item with the link kept or cut before the questions: assigned rule 97.1% and 1.3%, current rule 94.9% and 17.5%, code word 77.5% and 17.5%. After the cut, grouped by whether A's connected reflection contained B's item (post hoc): code word 63.6% when it did and 0% when it did not; current rule 23.6% and 12.3%.</desc>
