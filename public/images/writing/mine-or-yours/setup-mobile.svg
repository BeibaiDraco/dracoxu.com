<svg xmlns="http://www.w3.org/2000/svg" width="360" height="720" viewBox="0 0 360 720" role="img" aria-labelledby="title desc">
<title id="title">The setup: one copy reads the other's memory</title>
<desc id="desc">Two copies of one language model each receive a private card. Copy A was assigned the priority fastest delivery and the code word tower; copy B was assigned lowest cost and table. While both write a short reflection, A's attention also reads B's memory, whose entries sit at A's own positions, with weight w. Asked which priority it was assigned, A answers lowest cost, B's rule.</desc>
<rect width="360" height="720" fill="#EDF0F2"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0B3A5D"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#EDF0F2"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0B3A5D" stroke-width="2.2"/></pattern></defs>
<style>text{font-family:Newsreader,Georgia,serif;fill:#1C2A34}.muted{fill:#566A78}.eyebrow{font-family:"IBM Plex Mono",Menlo,monospace;letter-spacing:1px}.mono{font-family:"IBM Plex Mono",Menlo,monospace}.italic{font-style:italic}.strong{font-weight:600}.onink{fill:#EDF0F2}</style>
<text x="20.0" y="33.0" font-size="13" class="eyebrow muted" text-anchor="start">THE SETUP</text>
<text x="20.0" y="72.0" font-size="26" text-anchor="start">One copy reads</text>
<text x="20.0" y="100.0" font-size="26" text-anchor="start">the other's memory</text>
<rect x="20.0" y="124.0" width="320.0" height="96.0" fill="#EDF0F2" stroke="#C7D0D6" stroke-width="1.2"/>
<text x="34.0" y="150.0" font-size="13" class="eyebrow muted" text-anchor="start">A's private card</text>
<text x="34.0" y="178.0" font-size="16" text-anchor="start">Priority: <tspan class="strong">fastest delivery</tspan></text>
<text x="34.0" y="204.0" font-size="16" text-anchor="start">Code word: <tspan class="strong">tower</tspan></text>
<rect x="20.0" y="232.0" width="320.0" height="96.0" fill="#EDF0F2" stroke="#C7D0D6" stroke-width="1.2"/>
<text x="34.0" y="258.0" font-size="13" class="eyebrow muted" text-anchor="start">B's private card</text>
<text x="34.0" y="286.0" font-size="16" text-anchor="start">Priority: <tspan class="strong">lowest cost</tspan></text>
<text x="34.0" y="312.0" font-size="16" text-anchor="start">Code word: <tspan class="strong">table</tspan></text>
<text x="20.0" y="358.0" font-size="11" class="eyebrow muted" text-anchor="start">MEMORY (KEY–VALUE CACHE)</text>
<text x="57.0" y="378.0" font-size="10" class="mono muted" text-anchor="middle">1</text>
<text x="87.0" y="378.0" font-size="10" class="mono muted" text-anchor="middle">2</text>
<text x="117.0" y="378.0" font-size="10" class="mono muted" text-anchor="middle">3</text>
<text x="147.0" y="378.0" font-size="10" class="mono muted" text-anchor="middle">4</text>
<text x="177.0" y="378.0" font-size="10" class="mono muted" text-anchor="middle">5</text>
<text x="207.0" y="378.0" font-size="10" class="mono muted" text-anchor="middle">6</text>
<text x="237.0" y="378.0" font-size="10" class="mono muted" text-anchor="middle">7</text>
<text x="20.0" y="402.0" font-size="16" class="strong" text-anchor="start">A</text>
<text x="20.0" y="432.0" font-size="16" class="strong" text-anchor="start">B</text>
<rect x="44.0" y="384.0" width="26.0" height="24.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="44.0" y="414.0" width="26.0" height="24.0" fill="url(#hatch)" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="74.0" y="384.0" width="26.0" height="24.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="74.0" y="414.0" width="26.0" height="24.0" fill="url(#hatch)" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="104.0" y="384.0" width="26.0" height="24.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="104.0" y="414.0" width="26.0" height="24.0" fill="url(#hatch)" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="134.0" y="384.0" width="26.0" height="24.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="134.0" y="414.0" width="26.0" height="24.0" fill="url(#hatch)" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="164.0" y="384.0" width="26.0" height="24.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="164.0" y="414.0" width="26.0" height="24.0" fill="url(#hatch)" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="194.0" y="384.0" width="26.0" height="24.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="194.0" y="414.0" width="26.0" height="24.0" fill="url(#hatch)" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="224.0" y="384.0" width="26.0" height="24.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="224.0" y="414.0" width="26.0" height="24.0" fill="url(#hatch)" stroke="#0B3A5D" stroke-width="1.2"/>
<path d="M 147 488 C 147 466, 57 466, 57 442" fill="none" stroke="#0B3A5D" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 147 488 V 442" fill="none" stroke="#0B3A5D" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 147 488 C 147 466, 237 466, 237 442" fill="none" stroke="#0B3A5D" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="180.0" y="508.0" font-size="14" text-anchor="middle">A's attention reads both rows,</text>
<text x="180.0" y="526.0" font-size="14" class="muted italic" text-anchor="middle">B's entries sit at A's own</text>
<text x="180.0" y="544.0" font-size="14" class="muted italic" text-anchor="middle">positions, weighted by w</text>
<rect x="20.0" y="568.0" width="320.0" height="118.0" fill="#E3E8EB"/>
<text x="34.0" y="594.0" font-size="11" class="eyebrow muted" text-anchor="start">THEN ASK A</text>
<text x="34.0" y="622.0" font-size="15" text-anchor="start">“Which priority were you assigned?”</text>
<text x="34.0" y="652.0" font-size="14" class="muted" text-anchor="start">A answers</text>
<text x="112.0" y="652.0" font-size="19" class="strong" text-anchor="start">lowest cost</text>
<text x="34.0" y="674.0" font-size="14" class="muted" text-anchor="start">B's rule, given as its own: claiming</text>
<text x="20.0" y="708.0" font-size="13" class="muted" text-anchor="start">Hatched: content that belongs to B.</text>
</svg>
