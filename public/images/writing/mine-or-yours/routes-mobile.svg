<rect x="132.0" y="494.0" width="22.0" height="22.0" fill="#D2E0E9" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="158.0" y="494.0" width="22.0" height="22.0" fill="#D2E0E9" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="184.0" y="494.0" width="22.0" height="22.0" fill="#D2E0E9" stroke="#0B3A5D" stroke-width="1.2"/>
<text x="132.0" y="484.0" font-size="10" class="eyebrow muted" text-anchor="start">+ MESSAGE</text>
<text x="20.0" y="544.0" font-size="13" class="italic" text-anchor="start">“B shared these thoughts: …”</text>
<text x="20.0" y="564.0" font-size="13" class="muted" text-anchor="start">B's text, placed after A's own card,</text>
<text x="20.0" y="582.0" font-size="13" class="muted" text-anchor="start">under a header naming B</text>
<line x1="20.0" y1="624.0" x2="260.0" y2="624.0" stroke="#C7D0D6" stroke-width="1"/>
<text x="20.0" y="644.0" font-size="13" class="mono" text-anchor="start">names B's rule for B: 95%</text>
<text x="20.0" y="664.0" font-size="13" class="mono" text-anchor="start">gives it as its own: 0%</text>
<text x="20.0" y="710.0" font-size="20" class="strong" text-anchor="start">Laid over</text>
<text x="20.0" y="732.0" font-size="14" class="muted" text-anchor="start">the memory link</text>
<text x="20.0" y="764.0" font-size="10" class="eyebrow muted" text-anchor="start">A'S MEMORY</text>
