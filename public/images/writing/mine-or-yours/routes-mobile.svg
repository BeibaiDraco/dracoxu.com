<rect x="72.0" y="804.0" width="22.0" height="22.0" fill="url(#hatch)" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="98.0" y="804.0" width="22.0" height="22.0" fill="url(#hatch)" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="124.0" y="804.0" width="22.0" height="22.0" fill="url(#hatch)" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="150.0" y="804.0" width="22.0" height="22.0" fill="url(#hatch)" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="176.0" y="804.0" width="22.0" height="22.0" fill="url(#hatch)" stroke="#0B3A5D" stroke-width="1.2"/>
<text x="20.0" y="852.0" font-size="13" class="muted" text-anchor="start">B's memory at the same positions</text>
<text x="20.0" y="870.0" font-size="13" class="muted" text-anchor="start">as A's own, read by A's attention</text>
<line x1="20.0" y1="904.0" x2="260.0" y2="904.0" stroke="#C7D0D6" stroke-width="1"/>
<text x="20.0" y="924.0" font-size="13" class="mono" text-anchor="start">names B's rule for B: 20% / 69%</text>
<text x="20.0" y="944.0" font-size="13" class="mono" text-anchor="start">gives it as its own: 52% / 97%</text>
<text x="20.0" y="964.0" font-size="12" class="mono muted" text-anchor="start">at w = 1 / w = 2</text>
<text x="20.0" y="986.0" font-size="12" class="muted italic" text-anchor="start">Vector matched to the link at w = 1.</text>
