<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1000" viewBox="0 0 360 1000" role="img" aria-labelledby="title desc">
<title id="title">Three ways B's rule can reach A</title>
<desc id="desc">Nudged: a steering vector for B's rule is added to A's internal state; A names B's rule for B in 15% of answers and gives it as its own in none. Told: B's text is placed after A's card under a header naming B; A names B's rule for B in 95% and gives it as its own in none. Laid over: B's memory sits at the same positions as A's own; at w = 1 A names B's rule for B in 20% and gives it as its own in 52%; at w = 2, 69% and 97%.</desc>
<rect width="360" height="1000" fill="#EDF0F2"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0B3A5D"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#EDF0F2"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0B3A5D" stroke-width="2.2"/></pattern></defs>
<style>text{font-family:Newsreader,Georgia,serif;fill:#1C2A34}.muted{fill:#566A78}.eyebrow{font-family:"IBM Plex Mono",Menlo,monospace;letter-spacing:1px}.mono{font-family:"IBM Plex Mono",Menlo,monospace}.italic{font-style:italic}.strong{font-weight:600}.onink{fill:#EDF0F2}</style>
<text x="20.0" y="33.0" font-size="13" class="eyebrow muted" text-anchor="start">THREE ROUTES</text>
<text x="20.0" y="72.0" font-size="25" text-anchor="start">Three ways B's rule</text>
<text x="20.0" y="100.0" font-size="25" text-anchor="start">can reach A</text>
<text x="20.0" y="150.0" font-size="20" class="strong" text-anchor="start">Nudged</text>
<text x="20.0" y="172.0" font-size="14" class="muted" text-anchor="start">a steering vector</text>
<text x="20.0" y="204.0" font-size="10" class="eyebrow muted" text-anchor="start">A'S MEMORY</text>
<rect x="20.0" y="214.0" width="22.0" height="22.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="46.0" y="214.0" width="22.0" height="22.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="72.0" y="214.0" width="22.0" height="22.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="98.0" y="214.0" width="22.0" height="22.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="124.0" y="214.0" width="22.0" height="22.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="150.0" y="214.0" width="22.0" height="22.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="176.0" y="214.0" width="22.0" height="22.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
<text x="20.0" y="264.0" font-size="13" class="muted" text-anchor="start">A's internal state as it thinks</text>
<line x1="20.0" y1="278.0" x2="198.0" y2="278.0" stroke="#0B3A5D" stroke-width="1.4"/>
<rect x="30.0" y="318.0" width="22.0" height="22.0" fill="url(#hatch)" stroke="#0B3A5D" stroke-width="1.2"/>
<path d="M 41 316 V 284" fill="none" stroke="#0B3A5D" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="62.0" y="334.0" font-size="13" class="muted" text-anchor="start">a direction for B's rule, added</text>
<line x1="20.0" y1="344.0" x2="260.0" y2="344.0" stroke="#C7D0D6" stroke-width="1"/>
<text x="20.0" y="364.0" font-size="13" class="mono" text-anchor="start">names B's rule for B: 15%</text>
<text x="20.0" y="384.0" font-size="13" class="mono" text-anchor="start">gives it as its own: 0%</text>
<text x="20.0" y="430.0" font-size="20" class="strong" text-anchor="start">Told</text>
<text x="20.0" y="452.0" font-size="14" class="muted" text-anchor="start">a labelled message</text>
<text x="20.0" y="484.0" font-size="10" class="eyebrow muted" text-anchor="start">A'S MEMORY</text>
<rect x="20.0" y="494.0" width="22.0" height="22.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
