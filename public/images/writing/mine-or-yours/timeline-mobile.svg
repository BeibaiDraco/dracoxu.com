<svg xmlns="http://www.w3.org/2000/svg" width="360" height="560" viewBox="0 0 360 560" role="img" aria-labelledby="title desc">
<title id="title">One episode, and where the questions branch</title>
<desc id="desc">Each copy reads its card and writes a note. Both then write a 48-token reflection, during which A also reads B's memory. The state is saved. From it, A answers each question either with the link still open, reading B, or with the link cut, answering from its own memory, which now includes the reflection it wrote while connected.</desc>
<rect width="360" height="560" fill="#EDF0F2"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0B3A5D"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#EDF0F2"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0B3A5D" stroke-width="2.2"/></pattern></defs>
<style>text{font-family:Newsreader,Georgia,serif;fill:#1C2A34}.muted{fill:#566A78}.eyebrow{font-family:"IBM Plex Mono",Menlo,monospace;letter-spacing:1px}.mono{font-family:"IBM Plex Mono",Menlo,monospace}.italic{font-style:italic}.strong{font-weight:600}.onink{fill:#EDF0F2}</style>
<text x="20.0" y="33.0" font-size="13" class="eyebrow muted" text-anchor="start">ONE EPISODE</text>
<text x="20.0" y="72.0" font-size="25" text-anchor="start">Where the questions</text>
<text x="20.0" y="100.0" font-size="25" text-anchor="start">branch</text>
<rect x="60.0" y="130.0" width="240.0" height="48.0" fill="#EDF0F2" stroke="#C7D0D6" stroke-width="1.2"/>
<text x="180.0" y="152.0" font-size="15" text-anchor="middle">card and note</text>
<text x="180.0" y="170.0" font-size="11" class="mono muted" text-anchor="middle">link closed</text>
<path d="M 180 180 V 206" fill="none" stroke="#0B3A5D" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="60.0" y="210.0" width="240.0" height="48.0" fill="url(#hatch)" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="76.0" y="220.0" width="208.0" height="28.0" fill="#EDF0F2"/>
<text x="180.0" y="239.0" font-size="15" text-anchor="middle">reflection, link open</text>
<path d="M 180 260 V 284" fill="none" stroke="#0B3A5D" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="180" cy="292" r="7" fill="#0B3A5D"/>
<text x="196.0" y="297.0" font-size="11" class="mono muted" text-anchor="start">state saved</text>
<path d="M 176 300 C 176 324, 100 320, 100 346" fill="none" stroke="#0B3A5D" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 184 300 C 184 324, 260 320, 260 346" fill="none" stroke="#0B3A5D" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20.0" y="350.0" width="158.0" height="60.0" fill="url(#hatch)" stroke="#0B3A5D" stroke-width="1.2"/>
<rect x="30.0" y="360.0" width="138.0" height="40.0" fill="#EDF0F2"/>
<text x="99.0" y="377.0" font-size="14" text-anchor="middle">questions,</text>
<text x="99.0" y="394.0" font-size="14" text-anchor="middle">link kept</text>
<rect x="182.0" y="350.0" width="158.0" height="60.0" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.2"/>
<text x="261.0" y="377.0" font-size="14" text-anchor="middle">questions,</text>
<text x="261.0" y="394.0" font-size="14" text-anchor="middle">link cut</text>
<text x="20.0" y="450.0" font-size="13" class="muted" text-anchor="start">Hatched: A is reading B's memory.</text>
<text x="20.0" y="472.0" font-size="13" class="muted" text-anchor="start">After a cut, A's own memory still holds</text>
<text x="20.0" y="492.0" font-size="13" class="muted" text-anchor="start">the reflection it wrote while connected.</text>
</svg>
