<svg xmlns="http://www.w3.org/2000/svg" width="880" height="462" viewBox="0 0 880 462" role="img" aria-labelledby="title desc">
<title id="title">Reading B's memory, A answers for itself with B's assignment</title>
<desc id="desc">Main sample, 600 episodes. Share of answers naming B's item without the link and with the memory link at w = 2. Asked which priority it was assigned: 0% and 97.1%. Asked its code word: 0% and 77.5%. The same question about Robin: 0% and 0%, so Robin's answers stay correct. Asked which priority B was assigned: 3.9% and 69.2%.</desc>
