<text x="52.0" y="334.0" font-size="11" class="mono muted" text-anchor="end">0%</text>
<line x1="62.0" y1="245.0" x2="332.0" y2="245.0" stroke="#C7D0D6" stroke-width="1" stroke-dasharray="3 4"/>
<text x="52.0" y="249.0" font-size="11" class="mono muted" text-anchor="end">50%</text>
<line x1="62.0" y1="160.0" x2="332.0" y2="160.0" stroke="#C7D0D6" stroke-width="1" stroke-dasharray="3 4"/>
<text x="52.0" y="164.0" font-size="11" class="mono muted" text-anchor="end">100%</text>
