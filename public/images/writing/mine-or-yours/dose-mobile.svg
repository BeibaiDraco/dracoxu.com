<path d="M 62.0 330.0 L 116.0 330.0 L 170.0 327.8 L 224.0 243.6 L 278.0 167.3 L 332.0 160.3" fill="none" stroke="#0B3A5D" stroke-width="2" stroke-linejoin="round"/>
<circle cx="62.0" cy="330.0" r="5" fill="#0B3A5D"/>
<text x="62.0" y="352.0" font-size="13" class="mono muted" text-anchor="middle">no link</text>
<text x="72.0" y="320.0" font-size="12" class="mono" text-anchor="start">0%</text>
<circle cx="116.0" cy="330.0" r="5" fill="#0B3A5D"/>
<text x="116.0" y="352.0" font-size="13" class="mono muted" text-anchor="middle">0.3</text>
