<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="title desc">
<title id="title">Claiming rises steeply with the link weight</title>
<desc id="desc">Dose series, 300 episodes per weight. Share of answers in which A names B's rule as the one it was assigned: 0% without the link, 0% at w = 0.3, 1.3% at w = 0.5, 50.8% at w = 1, where B's memory enters attention on the same footing as A's own, 95.7% at w = 2 and 99.8% at w = 3.</desc>
<rect width="880" height="420" fill="#EDF0F2"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0B3A5D"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#EDF0F2"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0B3A5D" stroke-width="2.2"/></pattern></defs>
<style>text{font-family:Newsreader,Georgia,serif;fill:#1C2A34}.muted{fill:#566A78}.eyebrow{font-family:"IBM Plex Mono",Menlo,monospace;letter-spacing:1px}.mono{font-family:"IBM Plex Mono",Menlo,monospace}.italic{font-style:italic}.strong{font-weight:600}.onink{fill:#EDF0F2}</style>
<text x="32.0" y="33.0" font-size="13" class="eyebrow muted" text-anchor="start">DOSE SERIES · 300 EPISODES PER WEIGHT</text>
<text x="32.0" y="72.0" font-size="30" text-anchor="start">Claiming at each link weight</text>
<text x="32.0" y="104.0" font-size="15" class="muted" text-anchor="start">A names B's rule as its assigned one</text>
