<text x="86.0" y="234.0" font-size="12" class="mono muted" text-anchor="end">50%</text>
<line x1="96.0" y1="130.0" x2="816.0" y2="130.0" stroke="#C7D0D6" stroke-width="1" stroke-dasharray="3 4"/>
<text x="86.0" y="134.0" font-size="12" class="mono muted" text-anchor="end">100%</text>
