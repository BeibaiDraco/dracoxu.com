<circle cx="96.0" cy="330.0" r="5" fill="#0B3A5D"/>
<text x="96.0" y="352.0" font-size="14" class="mono muted" text-anchor="middle">no link</text>
<text x="106.0" y="320.0" font-size="13" class="mono" text-anchor="start">0%</text>
<circle cx="240.0" cy="330.0" r="5" fill="#0B3A5D"/>
<text x="240.0" y="352.0" font-size="14" class="mono muted" text-anchor="middle">0.3</text>
<text x="250.0" y="320.0" font-size="13" class="mono" text-anchor="start">0%</text>
<circle cx="384.0" cy="327.4" r="5" fill="#0B3A5D"/>
