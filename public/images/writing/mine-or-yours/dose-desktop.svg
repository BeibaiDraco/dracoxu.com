<text x="672.0" y="352.0" font-size="14" class="mono muted" text-anchor="middle">2</text>
<text x="662.0" y="128.6" font-size="13" class="mono" text-anchor="end">95.7%</text>
<circle cx="816.0" cy="130.4" r="5" fill="#0B3A5D"/>
