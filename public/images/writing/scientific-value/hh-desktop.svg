<svg xmlns="http://www.w3.org/2000/svg" width="880" height="295" viewBox="0 0 880 295" role="img" aria-labelledby="title desc">
<title id="title">From current measurements to the nerve impulse</title><desc id="desc">Three steps in the Hodgkin–Huxley account: voltage-clamp measurements of membrane current support conductance relations; equations connect these relations to the nerve impulse and its propagation. The arrows distinguish experimental support from model derivation. This is a conceptual schematic, with no simulated or experimental trace.</desc>
<rect width="880" height="295" fill="#EDF0F2"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0B3A5D"/></marker></defs>
<style>text{font-family:Newsreader,Georgia,serif;fill:#1C2A34}.mono{font-family:"IBM Plex Mono",Menlo,monospace;letter-spacing:.3px}.muted{fill:#566A78}.white{fill:#EDF0F2}</style>
<text x="24" y="33" font-size="13" class="mono muted" text-anchor="start" >01</text>
