<line x1="111" y1="110" x2="111" y2="152" stroke="#0B3A5D" stroke-width="2"/>
<line x1="80" y1="131" x2="98" y2="131" stroke="#0B3A5D" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="117" y1="131" x2="139" y2="131" stroke="#0B3A5D" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="75" y="124" font-size="17" class="" text-anchor="end" >I</text>
<text x="108" y="174" font-size="13" class="mono muted" text-anchor="middle" >hold V fixed</text>
<text x="433" y="128" font-size="27" text-anchor="middle"><tspan font-style="italic">g</tspan><tspan font-size="17" baseline-shift="sub">Na</tspan></text>
<text x="433" y="160" font-size="27" text-anchor="middle"><tspan font-style="italic">g</tspan><tspan font-size="17" baseline-shift="sub">K</tspan></text>
<text x="433" y="183" font-size="13" class="mono muted" text-anchor="middle" >conductances</text>
<line x1="700" y1="136" x2="783" y2="136" stroke="#0B3A5D" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="711" y1="119" x2="711" y2="129" stroke="#0B3A5D" stroke-width="1.4"/>
<line x1="711" y1="144" x2="711" y2="154" stroke="#0B3A5D" stroke-width="1.4"/>
