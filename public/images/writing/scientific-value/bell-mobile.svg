<svg xmlns="http://www.w3.org/2000/svg" width="360" height="930" viewBox="0 0 360 930" role="img" aria-labelledby="title desc">
<title id="title">A selected score and a broader guarantee</title><desc id="desc">Panel A is an exact local selection model. The four setting pairs 00, 01, 10, and 11 each retain the matching quarter of shared hidden labels. Their retained correlations are 0.6, 0.6, 0.6, and −0.6, giving S = 2.4. Panel B is a separate conditional comparison: a guarantee over the wider class of local mechanisms includes the restricted class and an additional relevant selection mechanism. Diagram areas have no quantitative meaning. Neither panel is a reconstruction of Hensen’s experimental data.</desc>
