<text x="18" y="438" font-size="15" class="mono" text-anchor="start" >S = 0.6 + 0.6 + 0.6 − (−0.6)</text>
<text x="18" y="476" font-size="29" class="" text-anchor="start" >= 2.4</text>
<text x="122" y="476" font-size="17" class="" text-anchor="start" >with a local explanation</text>
<text x="18" y="505" font-size="15" class="muted" text-anchor="start" >Exact model values, after selection.</text>
<text x="18" y="546" font-size="12" class="mono muted" text-anchor="start" >B  /  A SEPARATE COMPARISON</text>
<line x1="18" y1="559" x2="342" y2="559" stroke="#0B3A5D" stroke-width="1.5"/>
<text x="18" y="593" font-size="22" class="" text-anchor="start" >What does a guarantee cover?</text>
<rect x="18" y="613" width="324" height="223" fill="#D2E0E9" stroke="#0B3A5D" stroke-width="1.5"/>
<text x="34" y="642" font-size="21" class="" text-anchor="start" >Wider class</text>
<rect x="34" y="662" width="170" height="72" fill="#EDF0F2" stroke="#0B3A5D" stroke-width="1.5"/>
<text x="49" y="690" font-size="18" class="" text-anchor="start" >Restricted</text>
<text x="49" y="715" font-size="18" class="" text-anchor="start" >class</text>
<circle cx="228" cy="697" r="5" fill="#0B3A5D" stroke="none"/>
<text x="34" y="767" font-size="16" class="" text-anchor="start" >A relevant selection mechanism</text>
<text x="34" y="789" font-size="16" class="" text-anchor="start" >lies outside the restricted class.</text>
<line x1="228" y1="704" x2="228" y2="744" stroke="#0B3A5D" stroke-width="1"/>
<text x="18" y="870" font-size="16" class="muted" text-anchor="start" >Same target and error tolerance.</text>
<text x="18" y="892" font-size="16" class="muted" text-anchor="start" >Both studies: valid, informative evidence.</text>
